<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Specifications</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary: #059669;
            --primary-hover: #047857;
            --primary-light: #ecfdf5;
            --bg-main: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -1px rgba(0, 0, 0, 0.04);
            --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
            --radius-lg: 16px;
            --radius-md: 12px;
            --radius-sm: 8px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 3rem;
        }

        /* Top Navigation Header */
        .navbar {
            width: 100%;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-sm);
        }

        .navbar-inner {
            max-width: 1100px;
            margin: 0 auto;
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 800;
            font-size: 1.25rem;
            color: var(--primary);
            text-decoration: none;
        }

        .brand-logo svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        .btn-close {
            background-color: #f1f5f9;
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 0.5rem 1rem;
            font-weight: 600;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 0.875rem;
            transition: all 0.2s ease;
        }

        .btn-close:hover {
            background-color: #e2e8f0;
        }

        /* Loading Spinner */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 1rem;
            z-index: 1000;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        #loader.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--border);
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Container Layout */
        .page-container {
            width: 100%;
            max-width: 1100px;
            padding: 2rem 1.5rem 0 1.5rem;
            display: none;
        }

        .page-container.visible {
            display: block;
        }

        /* Hero Section */
        .hero-card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-md);
            padding: 2rem;
            margin-bottom: 2rem;
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 2.5rem;
            align-items: start;
        }

        .hero-gallery {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .main-image-container {
            width: 100%;
            height: 340px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            overflow: hidden;
            background-color: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .main-image-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: transform 0.3s ease;
        }

        .main-image-container img:hover {
            transform: scale(1.03);
        }

        .thumbs-grid {
            display: flex;
            gap: 0.75rem;
            overflow-x: auto;
            padding-bottom: 0.25rem;
        }

        .thumb-item {
            width: 64px;
            height: 64px;
            border-radius: var(--radius-sm);
            border: 2px solid var(--border);
            overflow: hidden;
            cursor: pointer;
            flex-shrink: 0;
            background: #f1f5f9;
        }

        .thumb-item.active {
            border-color: var(--primary);
        }

        .thumb-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .hero-info {
            display: flex;
            flex-direction: column;
        }

        .badge-batch {
            align-self: flex-start;
            background-color: var(--primary-light);
            color: var(--primary);
            font-size: 0.8rem;
            font-weight: 700;
            padding: 0.35rem 0.75rem;
            border-radius: 20px;
            margin-bottom: 0.75rem;
            letter-spacing: 0.02em;
        }

        .hero-title {
            font-size: 2rem;
            font-weight: 800;
            color: var(--text-main);
            line-height: 1.2;
            margin-bottom: 0.75rem;
        }

        .hero-price-container {
            margin-bottom: 1.25rem;
        }

        .hero-price-row {
            display: flex;
            align-items: baseline;
            gap: 0.5rem;
        }

        .hero-price {
            font-size: 1.75rem;
            font-weight: 800;
            color: var(--primary);
        }

        .hero-price-label {
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .hero-unit-price {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-top: 0.2rem;
        }

        .hero-description {
            font-size: 0.975rem;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
            white-space: pre-line;
        }

        .key-meta-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            background-color: var(--bg-main);
            padding: 1rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
        }

        .meta-item label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 0.2rem;
        }

        .meta-item span {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-main);
        }

        /* Section Block Layout */
        .section-block {
            background-color: var(--card-bg);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            padding: 1.75rem 2rem;
            margin-bottom: 2rem;
        }

        .section-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 1.25rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .section-title::before {
            content: "";
            display: block;
            width: 4px;
            height: 20px;
            background-color: var(--primary);
            border-radius: 4px;
        }

        /* Detailed Specifications Table */
        .specs-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }

        .specs-table tr:nth-child(even) {
            background-color: var(--bg-main);
        }

        .specs-table td {
            padding: 0.85rem 1rem;
            font-size: 0.925rem;
            border-bottom: 1px solid var(--border);
        }

        .specs-table tr:last-child td {
            border-bottom: none;
        }

        .specs-table .td-label {
            font-weight: 600;
            color: var(--text-muted);
            width: 35%;
            vertical-align: top;
        }

        .specs-table .td-value {
            color: var(--text-main);
            font-weight: 500;
            word-break: break-word;
        }

        /* Map Container */
        .map-wrapper {
            width: 100%;
            height: 320px;
            border-radius: var(--radius-md);
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .map-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Videos Section Grid */
        .videos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .video-card {
            background: var(--bg-main);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .video-wrapper {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000000;
        }

        .video-wrapper iframe,
        .video-wrapper video {
            width: 100%;
            height: 100%;
            border: none;
        }

        .video-card-body {
            padding: 1rem;
        }

        .video-card-desc {
            font-size: 0.9rem;
            color: var(--text-main);
            font-weight: 500;
        }

        /* Documents / Certificates Grid */
        .certs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.25rem;
        }

        .cert-card {
            background-color: var(--bg-main);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .cert-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .cert-icon {
            width: 40px;
            height: 40px;
            background-color: var(--primary-light);
            color: var(--primary);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        .cert-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .cert-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .cert-media-preview {
            width: 100%;
            min-height: 200px;
            max-height: 400px;
            border-radius: var(--radius-sm);
            overflow: hidden;
            border: 1px solid var(--border);
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            padding: 0.5rem;
        }

        .cert-media-preview img {
            max-width: 100%;
            max-height: 380px;
            width: auto;
            height: auto;
            object-fit: contain;
            transition: transform 0.2s ease;
        }

        .cert-media-preview img:hover {
            transform: scale(1.02);
        }

        .btn-preview {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.6rem 1rem;
            background-color: var(--primary-light);
            border: 1px solid var(--primary);
            color: var(--primary);
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: auto;
        }

        .btn-preview:hover {
            background-color: var(--primary);
            color: #ffffff;
        }

        .btn-download {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.6rem 1rem;
            background-color: #ffffff;
            border: 1px solid var(--border);
            color: var(--primary);
            border-radius: var(--radius-sm);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 700;
            transition: all 0.2s ease;
            margin-top: auto;
        }

        .btn-download:hover {
            background-color: var(--primary-light);
            border-color: var(--primary);
        }

        /* Error Banner */
        .error-message {
            text-align: center;
            color: #dc2626;
            background-color: #fef2f2;
            border: 1px solid #fecaca;
            padding: 2rem;
            border-radius: var(--radius-md);
            font-size: 1.1rem;
            margin-top: 2rem;
        }

        /* Image Lightbox Modal */
        .lightbox-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(4px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .lightbox-modal.active {
            display: flex;
        }

        .lightbox-modal img {
            max-width: 90vw;
            max-height: 85vh;
            object-fit: contain;
            border-radius: var(--radius-md);
        }

        /* Footer */
        .page-footer {
            margin-top: 2rem;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .page-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .page-footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .hero-card {
                grid-template-columns: 1fr;
                padding: 1.25rem;
                gap: 1.5rem;
            }

            .main-image-container {
                height: 260px;
            }

            .section-block {
                padding: 1.25rem;
            }

            .key-meta-grid {
                grid-template-columns: 1fr;
            }

            .specs-table .td-label {
                width: 45%;
            }
        }
    </style>
</head>

<body>

    <!-- Fullscreen Loader -->
    <div id="loader">
        <div class="spinner"></div>
        <p style="color: var(--text-muted); font-size: 0.95rem; font-weight: 600;">Loading Specifications...</p>
    </div>

    <!-- Navigation Header -->
    <header class="navbar">
        <div class="navbar-inner">
            <a href="#" class="brand-logo">
                <svg viewBox="0 0 24 24">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
                </svg>
                Specifications
            </a>
            <button class="btn-close" onclick="closeTab()">Close</button>
        </div>
    </header>

    <div id="contentContainer" class="page-container">

        <!-- Top Hero Section -->
        <div class="hero-card">
            <!-- Right: Primary Product Info -->
            <div class="hero-info" style="grid-column: span 2;">
                <div id="batchBadge" class="badge-batch" style="display: none;"></div>
                <h1 id="heroTitle" class="hero-title">Product Name</h1>

                <div id="heroPriceContainer" class="hero-price-container" style="display: none;">
                    <div class="hero-price-row">
                        <span id="heroPrice" class="hero-price"></span>
                        <span class="hero-price-label">(MRP inclusive of all taxes)</span>
                    </div>
                    <div id="heroUnitPrice" class="hero-unit-price" style="display: none;"></div>
                </div>

                <p id="heroDescription" class="hero-description"></p>

                <div class="key-meta-grid">
                    <div class="meta-item">
                        <label>Manufactured By</label>
                        <span id="metaManufacturedBy">—</span>
                    </div>
                    <div class="meta-item">
                        <label>Marketed By</label>
                        <span id="metaMarketedBy">—</span>
                    </div>
                    <div class="meta-item">
                        <label>Manufacturing Date</label>
                        <span id="metaMfgDate">—</span>
                    </div>
                    <div class="meta-item">
                        <label>Country of Origin</label>
                        <span id="metaCountry">—</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Section 1: Detailed Specifications Table -->
        <div class="section-block">
            <h2 class="section-title">Product Specifications</h2>
            <table class="specs-table">
                <tbody id="specsTableBody"></tbody>
            </table>
        </div>

        <!-- Location Map Section -->
        <div id="mapSection" class="section-block" style="display: none;">
            <h2 class="section-title">Location Map</h2>
            <div id="mapWrapper" class="map-wrapper"></div>
        </div>

        <!-- Section 2: Product Videos -->
        <div id="videosSection" class="section-block" style="display: none;">
            <h2 class="section-title">Product Videos</h2>
            <div id="videosGrid" class="videos-grid"></div>
        </div>

        <!-- Section: Product Images -->
        <div id="productImagesSection" class="section-block" style="display: none;">
            <h2 class="section-title">Product Images</h2>
            <div id="productImagesGrid" class="certs-grid"></div>
        </div>

        <!-- Section 3: Certificates & Documents -->
        <div id="certificatesSection" class="section-block" style="display: none;">
            <h2 class="section-title">Certificates & Quality Reports</h2>
            <div id="certsGrid" class="certs-grid"></div>
        </div>

        <!-- Page Footer -->
        <div class="page-footer">
            <p>Verified By</p>
            <p id="footerName"></p>
            <p id="footerWebsite"></p>
        </div>

    </div>

    <!-- Image Lightbox Modal -->
    <div id="lightboxModal" class="lightbox-modal" onclick="closeLightbox()">
        <img id="lightboxImg" src="" alt="Enlarged View" />
    </div>

    <script>
        const API_BASE = "https://location-map-a89a.onrender.com/api";

        const fieldLabels = {
            product_name: "Product Name",
            batch_id: "Batch Number",
            description: "Description",
            quantity: "Quantity",
            mrp: "MRP",
            mrp_currency: "Currency of MRP",
            manufactured_by: "Manufactured By",
            marketed_by: "Marketed By",
            mfg_date: "Month & Year of Manufacturing",
            country_of_origin: "Country of Origin",
            customer_care_contact: "Customer Care Contact",
            customer_care_phone: "Customer Care Phone Number",
            serial_number: "Serial Number",
            product_size: "Product Size",
            unit_sales_price: "Unit Sales Price",
            gst_number: "GST Number",
            expiry_date: "Expiry Date",
            expiry_details: "Expiry Details",
            customer_care_email: "Customer Care Email ID",
            website: "Website",
            storage_location_manufacturer: "Storage Location (Manufacturer)",
            storage_instructions_consumer: "Storage Instructions for Consumer",
            package_recycling: "Package Recycling",
            whatsapp_link: "WhatsApp Link",
            notes: "Notes"
        };

        function closeTab() {
            window.close();
            setTimeout(() => {
                window.open('', '_self', '');
                window.close();
            }, 100);
            setTimeout(() => {
                alert("Your browser security settings prevented closing this tab. Please close it manually.");
            }, 500);
        }

        function hideLoader() {
            const loader = document.getElementById("loader");
            if (loader) loader.classList.add("hidden");
        }

        function openLightbox(src) {
            if (!src) return;
            document.getElementById("lightboxImg").src = src;
            document.getElementById("lightboxModal").classList.add("active");
        }

        function closeLightbox() {
            document.getElementById("lightboxModal").classList.remove("active");
        }

        function resolveFileSource(fileObj) {
            if (!fileObj) return '';

            if (typeof fileObj === 'string') {
                if (fileObj.startsWith('data:') || fileObj.startsWith('http://') || fileObj.startsWith('https://')) {
                    return fileObj;
                }
                return `${API_BASE}/files/stream/${fileObj}`;
            }

            if (fileObj.file_id || fileObj.id) {
                const fileId = fileObj.file_id || fileObj.id;
                return `${API_BASE}/files/stream/${fileId}`;
            }

            return fileObj.base64 || fileObj.url || '';
        }

        function getFirstLine(text) {
            if (!text) return '—';
            const cleanText = text.toString().trim();
            const lines = cleanText.split(/[\r\n,]/);
            return lines[0].trim() || cleanText;
        }

        function formatEmbedVideoUrl(url) {
            if (!url) return null;
            let cleanSrc = url.trim();

            const ytMatch = cleanSrc.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=|shorts\/))([\w-]{11})/);
            if (ytMatch && ytMatch[1]) {
                return `<iframe src="https://www.youtube.com/embed/${ytMatch[1]}" allowfullscreen></iframe>`;
            }

            if (cleanSrc.includes("facebook.com") || cleanSrc.includes("fb.watch")) {
                const encodedUrl = encodeURIComponent(cleanSrc);
                return `<iframe src="https://www.facebook.com/plugins/video.php?height=250&href=${encodedUrl}&show_text=false&width=500" allowfullscreen></iframe>`;
            }

            if (cleanSrc.includes("vimeo.com/")) {
                const videoId = cleanSrc.split("vimeo.com/")[1]?.split("?")[0];
                return `<iframe src="https://player.vimeo.com/video/${videoId}" allowfullscreen></iframe>`;
            }

            if (cleanSrc.match(/\.(mp4|webm|ogg)$/i) || cleanSrc.startsWith("data:video")) {
                return `<video src="${cleanSrc}" controls></video>`;
            }

            return null;
        }

        function renderData(data) {
            // Title & Header Information
            const prodName = data.product_name || "Product Details";
            document.title = `${prodName} - Specifications`;
            document.getElementById("heroTitle").textContent = prodName;

            if (data.batch_id) {
                const badge = document.getElementById("batchBadge");
                badge.textContent = `Batch #${data.batch_id}`;
                badge.style.display = "inline-block";
            }

            // MRP and Unit Sales Price
            if (data.mrp) {
                const currency = data.mrp_currency || "₹";
                document.getElementById("heroPrice").textContent = `${currency} ${data.mrp}`;
                document.getElementById("heroPriceContainer").style.display = "block";

                if (data.unit_sales_price) {
                    const unitPriceElem = document.getElementById("heroUnitPrice");
                    unitPriceElem.textContent = `Unit Price: ${currency} ${data.unit_sales_price}`;
                    unitPriceElem.style.display = "block";
                }
            }

            if (data.description) {
                document.getElementById("heroDescription").textContent = data.description;
            }

            // Populate Metadata Grid using First Line only
            if (data.manufactured_by) document.getElementById("metaManufacturedBy").textContent = getFirstLine(data.manufactured_by);
            if (data.marketed_by) document.getElementById("metaMarketedBy").textContent = getFirstLine(data.marketed_by);
            if (data.mfg_date) document.getElementById("metaMfgDate").textContent = data.mfg_date;
            if (data.country_of_origin) document.getElementById("metaCountry").textContent = data.country_of_origin;

            // 1. Populate Detailed Specifications Table
            const tableBody = document.getElementById("specsTableBody");
            let tableHtml = "";

            Object.keys(fieldLabels).forEach((key) => {
                const val = data[key];
                if (val && val.toString().trim() !== "") {
                    let formattedVal = val;
                    if (key === "website" || key === "whatsapp_link") {
                        formattedVal = `<a href="${val}" target="_blank" style="color: var(--primary); text-decoration: underline;">${val}</a>`;
                    } else if (key === "customer_care_email") {
                        formattedVal = `<a href="mailto:${val}" style="color: var(--primary); text-decoration: underline;">${val}</a>`;
                    }

                    tableHtml += `
                    <tr>
                        <td class="td-label">${fieldLabels[key]}</td>
                        <td class="td-value">${formattedVal}</td>
                    </tr>
                `;
                }
            });

            tableBody.innerHTML = tableHtml || `<tr><td colspan="2" style="text-align:center; color:var(--text-muted);">No additional specifications available.</td></tr>`;

            // 2. Render Location Coordinates Map
            if (data.location_coordinates) {
                const coords = data.location_coordinates.toString().split(",");
                if (coords.length >= 2) {
                    const lat = parseFloat(coords[0].trim());
                    const lon = parseFloat(coords[1].trim());
                    if (!isNaN(lat) && !isNaN(lon)) {
                        const bbox = `${lon - 0.01}%2C${lat - 0.01}%2C${lon + 0.01}%2C${lat + 0.01}`;
                        const mapIframe = `<iframe src="https://www.openstreetmap.org/export/embed.html?bbox=${bbox}&layer=mapnik&marker=${lat}%2C${lon}"></iframe>`;
                        document.getElementById("mapWrapper").innerHTML = mapIframe;
                        document.getElementById("mapSection").style.display = "block";
                    }
                }
            }

            // 3. Render Product Videos
            let videoList = [];
            if (data.product_videos && Array.isArray(data.product_videos)) {
                videoList = data.product_videos.filter(v => v.link && v.link.trim() !== "");
            } else {
                for (let i = 1; i <= 3; i++) {
                    const link = data[`video_link_${i}`];
                    const desc = data[`video_desc_${i}`];
                    if (link && link.trim() !== "") videoList.push({ link: link, description: desc || "" });
                }
            }

            if (videoList.length > 0) {
                let videosHtml = "";
                videoList.forEach((v) => {
                    const embedHtml = formatEmbedVideoUrl(v.link);
                    if (embedHtml) {
                        videosHtml += `
                        <div class="video-card">
                            <div class="video-wrapper">${embedHtml}</div>
                            ${v.description ? `<div class="video-card-body"><div class="video-card-desc">${v.description}</div></div>` : ''}
                        </div>
                    `;
                    }
                });

                if (videosHtml) {
                    document.getElementById("videosGrid").innerHTML = videosHtml;
                    document.getElementById("videosSection").style.display = "block";
                }
            }

            // 4. Render Product Images Below Videos
            let imageList = [];
            if (data.product_images && Array.isArray(data.product_images)) {
                imageList = data.product_images.filter(i => i.file || i.file_id || i.base64 || i.url);
            } else {
                for (let i = 1; i <= 6; i++) {
                    const file = data[`img_file_${i}`];
                    const desc = data[`img_desc_${i}`];
                    if (file) imageList.push({ file: file, description: desc || "" });
                }
            }

            if (imageList.length > 0) {
                let imagesHtml = "";
                imageList.forEach((imgObj) => {
                    const imgSrc = resolveFileSource(imgObj.file || imgObj.file_id || imgObj);
                    if (imgSrc) {
                        const imageTitle = imgObj.label || 'Product Image';
                        const imageDesc = imgObj.description || '';

                        imagesHtml += `
                            <div class="cert-card">
                                <div class="cert-header">
                                    <div>
                                        ${imageDesc ? `<div class="cert-desc">${imageDesc}</div>` : ''}
                                    </div>
                                </div>
                                <div class="cert-media-preview" onclick="openLightbox('${imgSrc}')">
                                    <img src="${imgSrc}" alt="${imageTitle}" />
                                </div>
                                <button class="btn-preview" onclick="openLightbox('${imgSrc}')">Preview Image</button>
                            </div>
                        `;
                    }
                });

                if (imagesHtml) {
                    document.getElementById("productImagesGrid").innerHTML = imagesHtml;
                    document.getElementById("productImagesSection").style.display = "block";
                }
            }

            // 5. Render Certificates & Documents
            let certList = [];
            if (data.certificates && Array.isArray(data.certificates)) {
                certList = data.certificates.filter(c => c.name || c.description || c.file || c.file_id);
            } else {
                for (let i = 1; i <= 10; i++) {
                    const name = data[`cert_name_${i}`];
                    const desc = data[`cert_desc_${i}`];
                    const file = data[`cert_file_${i}`];
                    if (name || desc || file) {
                        certList.push({ name: name || `Certificate ${i}`, description: desc || "", file: file });
                    }
                }
            }

            if (certList.length > 0) {
                let certsHtml = "";
                certList.forEach(c => {
                    const certSrc = resolveFileSource(c.file || c.file_id || c);

                    let mediaPreview = "";
                    if (certSrc) {
                        mediaPreview = `
                        <div class="cert-media-preview" onclick="openLightbox('${certSrc}')">
                            <img src="${certSrc}" alt="Certificate Full View" />
                        </div>
                    `;
                    }

                    certsHtml += `
                    <div class="cert-card">
                        <div class="cert-header">
                            <div class="cert-icon">📄</div>
                            <div>
                                <div class="cert-title">${c.name || 'Certificate'}</div>
                                ${c.description ? `<div class="cert-desc">${c.description}</div>` : ''}
                            </div>
                        </div>
                        ${mediaPreview}
                        ${certSrc ? `<button class="btn-preview" onclick="openLightbox('${certSrc}')">Preview</button>` : ''}
                    </div>
                `;
                });
                document.getElementById("certsGrid").innerHTML = certsHtml;
                document.getElementById("certificatesSection").style.display = "block";
            }

            // 6. Update Footer with Company Name and Website
            const companyName = getFirstLine(data.manufactured_by || data.marketed_by || "PureTrace");
            document.getElementById("footerName").textContent = companyName;

            if (data.website) {
                document.getElementById("footerWebsite").innerHTML = `<a href="${data.website}" target="_blank">${data.website}</a>`;
            } else {
                document.getElementById("footerWebsite").innerHTML = `<a href="https://www.dowellresearch.com" target="_blank">www.dowellresearch.com</a>`;
            }


            document.getElementById("contentContainer").classList.add("visible");
            hideLoader();
        }

        async function fetchProductData() {
            const urlParams = new URLSearchParams(window.location.search);
            const linkId = urlParams.get("id");

            if (!linkId) {
                const savedLocal = localStorage.getItem("puretrace_local_data");
                if (savedLocal) {
                    try {
                        renderData(JSON.parse(savedLocal));
                        return;
                    } catch (e) { }
                }
                showError("No Product ID specified in the URL.");
                return;
            }

            try {
                const res = await fetch(`${API_BASE}/get_medsign_link/${linkId}`);
                if (res.ok) {
                    const responseData = await res.json();
                    if (responseData?.record?.product_details) {
                        renderData(responseData.record.product_details);
                    } else {
                        showError("No product specifications available for this ID.");
                    }
                } else {
                    showError("Failed to load specifications from database.");
                }
            } catch (err) {
                console.error("Fetch error:", err);
                showError("Network error. Please check your connection.");
            }
        }

        function showError(message) {
            hideLoader();
            const container = document.getElementById("contentContainer");
            container.innerHTML = `<div class="error-message">⚠️ ${message}</div>`;
            container.classList.add("visible");
        }

        fetchProductData();
    </script>
</body>

</html>
