<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Specifications</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #000000;
            color: #ffffff;
            padding: 2rem 1.5rem;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        /* Loading Spinner */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 1rem;
            z-index: 1000;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        #loader.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            border-top-color: #10b981;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .page-container {
            width: 100%;
            max-width: 850px;
            display: none;
        }

        .page-container.visible {
            display: block;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #27272a;
            padding-bottom: 1.25rem;
            margin-bottom: 2rem;
        }

        .header h1 {
            font-size: 1.8rem;
            color: #ffffff;
            font-weight: 800;
        }

        .header-actions {
            display: flex;
            gap: 0.75rem;
        }

        .btn-action {
            background-color: #10b981;
            color: #000000;
            border: none;
            padding: 0.6rem 1.25rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.9rem;
            transition: background-color 0.2s;
        }

        .btn-action:hover {
            background-color: #059669;
            color: #ffffff;
        }

        .btn-secondary-action {
            background-color: #27272a;
            color: #ffffff;
            border: 1px solid #3f3f46;
            padding: 0.6rem 1.25rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .btn-secondary-action:hover {
            background-color: #3f3f46;
        }

        .section-heading {
            font-size: 1.2rem;
            color: #10b981;
            font-weight: 700;
            border-bottom: 1px solid #27272a;
            padding-bottom: 0.5rem;
            margin: 2rem 0 1rem 0;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
        }

        .spec-card {
            background-color: #18181b;
            border: 1px solid #27272a;
            border-radius: 12px;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .spec-card.full-width {
            grid-column: 1 / -1;
        }

        .spec-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #10b981;
            font-weight: 700;
        }

        .spec-value {
            font-size: 0.95rem;
            color: #f4f4f5;
            word-break: break-word;
        }

        .img-preview {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #27272a;
        }

        .btn-download {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 0.5rem;
            padding: 0.5rem 0.85rem;
            background-color: #09090b;
            border: 1px solid #3f3f46;
            color: #10b981;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            width: fit-content;
        }

        .error-message {
            text-align: center;
            color: #ef4444;
            font-size: 1.1rem;
            margin-top: 3rem;
        }

        @media (max-width: 640px) {
            .grid-container { grid-template-columns: 1fr; }
            .header { flex-direction: column; align-items: flex-start; gap: 1rem; }
        }

        @media print {
            .header-actions { display: none; }
            body { background-color: #ffffff; color: #000000; }
            .spec-card { border-color: #ccc; background-color: #fff; }
            .spec-value { color: #000; }
        }
    </style>
</head>

<body>

    <div id="loader">
        <div class="spinner"></div>
        <p style="color: #a1a1aa; font-size: 0.9rem;">Loading Product Specifications...</p>
    </div>

    <div id="contentContainer" class="page-container">
        <div class="header">
            <h1 id="pageTitle">Product Specifications</h1>
            <div class="header-actions">
                <!-- <button class="btn-secondary-action" onclick="window.print()">Print Page</button> -->
                <button class="btn-action" onclick="window.close()">Close</button>
            </div>
        </div>

        <div class="section-heading" style="margin-top:0;">Product Specifications</div>
        <div id="specsGrid" class="grid-container"></div>

        <div id="certificatesSection" style="display: none;">
            <div class="section-heading">Certificates</div>
            <div id="certsGrid" class="grid-container"></div>
        </div>

        <div id="imagesSection" style="display: none;">
            <div class="section-heading">Product Images</div>
            <div id="imagesGrid" class="grid-container"></div>
        </div>
    </div>

    <script>
        const API_BASE = "https://location-map-a89a.onrender.com/api";

        const fieldLabels = {
            product_name: "Product Name",
            batch_id: "Batch Number",
            description: "Description",
            quantity: "Quantity",
            mrp: "MRP",
            mrp_currency: "Currency of MRP",
            manufactured_by: "Manufactured By",
            marketed_by: "Marketed By",
            mfg_date: "Month & Year of Manufacturing",
            country_of_origin: "Country of Origin",
            customer_care_contact: "Customer Care Contact",
            customer_care_phone: "Customer Care Phone",
            splash_screen_video: "Splash Screen Video URL",
            social_youtube: "YouTube Link",
            social_instagram: "Instagram Link",
            social_facebook: "Facebook Link",
            serial_number: "Serial Number",
            product_size: "Product Size",
            unit_sales_price: "Unit Sales Price",
            gst_number: "GST Number",
            expiry_date: "Expiry Date",
            expiry_details: "Expiry Details",
            customer_care_email: "Customer Care Email",
            website: "Website",
            storage_location_manufacturer: "Storage Location (Manufacturer)",
            storage_instructions_consumer: "Storage Instructions (Consumer)",
            package_recycling: "Package Recycling",
            location_coordinates: "Location Coordinates",
            whatsapp_link: "WhatsApp Link",
            notes: "Notes"
        };

        function hideLoader() {
            const loader = document.getElementById("loader");
            if (loader) loader.classList.add("hidden");
        }

        function renderData(data) {
            const title = data.product_name ? `${data.product_name} - Specifications` : "Product Specifications";
            document.title = title;
            document.getElementById("pageTitle").textContent = title;

            // Render Specifications Grid
            const specsGrid = document.getElementById("specsGrid");
            let specsHtml = "";
            let count = 0;

            Object.keys(fieldLabels).forEach((key) => {
                const val = data[key];
                if (val && val.toString().trim() !== "") {
                    count++;
                    const isFullWidth = ["description", "notes", "storage_instructions_consumer", "expiry_details"].includes(key);
                    specsHtml += `
                        <div class="spec-card ${isFullWidth ? 'full-width' : ''}">
                            <div class="spec-label">${fieldLabels[key]}</div>
                            <div class="spec-value">${val}</div>
                        </div>
                    `;
                }
            });

            if (data.splash_screen_logo && data.splash_screen_logo.filename) {
                specsHtml += `
                    <div class="spec-card">
                        <div class="spec-label">Splash Screen Logo</div>
                        <div class="spec-value">${data.splash_screen_logo.filename}</div>
                    </div>
                `;
            }

            specsGrid.innerHTML = count > 0 ? specsHtml : `<div class="spec-card full-width" style="color:#71717a;">No specifications found.</div>`;

            // Render Certificates
            if (data.certificates && data.certificates.length > 0) {
                const validCerts = data.certificates.filter(c => c.name || c.description || c.file);
                if (validCerts.length > 0) {
                    let certsHtml = "";
                    validCerts.forEach(c => {
                        const fileLink = c.file ? `<a href="${c.file.base64}" download="${c.file.filename}" class="btn-download">📄 Download ${c.file.filename}</a>` : "";
                        certsHtml += `
                            <div class="spec-card">
                                <div style="font-weight:700; color:#10b981; font-size:1rem;">${c.name || 'Certificate'}</div>
                                ${c.description ? `<div style="font-size:0.85rem; color:#a1a1aa; margin-top:0.25rem;">${c.description}</div>` : ''}
                                ${fileLink}
                            </div>
                        `;
                    });
                    document.getElementById("certsGrid").innerHTML = certsHtml;
                    document.getElementById("certificatesSection").style.display = "block";
                }
            }

            // Render Product Images
            if (data.product_images && data.product_images.length > 0) {
                const validImgs = data.product_images.filter(i => i.file || i.description);
                if (validImgs.length > 0) {
                    let imgsHtml = "";
                    validImgs.forEach(img => {
                        imgsHtml += `
                            <div class="spec-card">
                                ${img.file ? `<img src="${img.file.base64}" alt="${img.label}" class="img-preview" />` : ''}
                                <div style="font-weight:700; color:#10b981; font-size:0.9rem; margin-top:0.5rem;">${img.label}</div>
                                ${img.description ? `<div style="font-size:0.85rem; color:#a1a1aa; margin-top:0.25rem;">${img.description}</div>` : ''}
                            </div>
                        `;
                    });
                    document.getElementById("imagesGrid").innerHTML = imgsHtml;
                    document.getElementById("imagesSection").style.display = "block";
                }
            }

            document.getElementById("contentContainer").classList.add("visible");
            hideLoader();
        }

        async function fetchProductData() {
            const urlParams = new URLSearchParams(window.location.search);
            const linkId = urlParams.get("id");

            if (!linkId) {
                // Fallback: check if local preview data exists
                const savedLocal = localStorage.getItem("puretrace_local_data");
                if (savedLocal) {
                    try {
                        renderData(JSON.parse(savedLocal));
                        return;
                    } catch (e) {}
                }
                showError("No Product ID specified in URL.");
                return;
            }

            try {
                const res = await fetch(`${API_BASE}/get_medsign_link/${linkId}`);
                if (res.ok) {
                    const responseData = await res.json();
                    if (responseData?.record?.product_details) {
                        renderData(responseData.record.product_details);
                    } else {
                        showError("No product specifications available for this ID.");
                    }
                } else {
                    showError("Failed to load specifications from database.");
                }
            } catch (err) {
                console.error("Fetch error:", err);
                showError("Network error. Please check your connection.");
            }
        }

        function showError(message) {
            hideLoader();
            const container = document.getElementById("contentContainer");
            container.innerHTML = `<div class="error-message">⚠️ ${message}</div>`;
            container.classList.add("visible");
        }

        fetchProductData();
    </script>
</body>

</html>
