<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Specifications</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #000000;
            color: #ffffff;
            padding: 2rem 1.5rem;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        /* Loading Spinner */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 1rem;
            z-index: 1000;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        #loader.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            border-top-color: #10b981;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .page-container {
            width: 100%;
            max-width: 850px;
            display: none;
        }

        .page-container.visible {
            display: block;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #27272a;
            padding-bottom: 1.25rem;
            margin-bottom: 2rem;
        }

        .header h1 {
            font-size: 1.8rem;
            color: #ffffff;
            font-weight: 800;
        }

        .header-actions {
            display: flex;
            gap: 0.75rem;
        }

        .btn-action {
            background-color: #10b981;
            color: #000000;
            border: none;
            padding: 0.6rem 1.25rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.9rem;
            transition: background-color 0.2s;
        }

        .btn-action:hover {
            background-color: #059669;
            color: #ffffff;
        }

        .section-heading {
            font-size: 1.2rem;
            color: #10b981;
            font-weight: 700;
            border-bottom: 1px solid #27272a;
            padding-bottom: 0.5rem;
            margin: 2rem 0 1rem 0;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
        }

        .spec-card {
            background-color: #18181b;
            border: 1px solid #27272a;
            border-radius: 12px;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .spec-card.full-width {
            grid-column: 1 / -1;
        }

        .spec-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #10b981;
            font-weight: 700;
        }

        .spec-value {
            font-size: 0.95rem;
            color: #f4f4f5;
            word-break: break-word;
        }

        .img-preview {
            width: 100%;
            height: 250px;
            object-fit: contain;
            background-color: #09090b;
            border-radius: 8px;
            border: 1px solid #27272a;
        }

        .btn-download {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 0.5rem;
            padding: 0.5rem 0.85rem;
            background-color: #09090b;
            border: 1px solid #3f3f46;
            color: #10b981;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            width: fit-content;
        }

        .error-message {
            text-align: center;
            color: #ef4444;
            font-size: 1.1rem;
            margin-top: 3rem;
        }

        @media (max-width: 640px) {
            .grid-container {
                grid-template-columns: 1fr;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }

            .img-preview {
                height: 200px;
            }
        }
    </style>
</head>

<body>

    <div id="loader">
        <div class="spinner"></div>
        <p style="color: #a1a1aa; font-size: 0.9rem;">Loading Product Specifications...</p>
    </div>

    <div id="contentContainer" class="page-container">
        <div class="header">
            <h1 id="pageTitle">Product Specifications</h1>
            <div class="header-actions">
                <button class="btn-action" onclick="closeTab()">Close</button>
            </div>
        </div>

        <div class="section-heading" style="margin-top:0;">Product Specifications</div>
        <div id="specsGrid" class="grid-container"></div>

        <!-- 1. Product Images First -->
        <div id="imagesSection" style="display: none;">
            <div class="section-heading">Product Images</div>
            <div id="imagesGrid" class="grid-container"></div>
        </div>

        <!-- 2. Product Videos Second -->
        <div id="videosSection" style="display: none;">
            <div class="section-heading">Product Videos</div>
            <div id="videosGrid" class="grid-container"></div>
        </div>

        <!-- 3. Certificates Third -->
        <div id="certificatesSection" style="display: none;">
            <div class="section-heading">Certificates</div>
            <div id="certsGrid" class="grid-container"></div>
        </div>
    </div>

    <script>
        const API_BASE = "https://location-map-a89a.onrender.com/api";

        const fieldLabels = {
            product_name: "Product Name",
            batch_id: "Batch Number",
            description: "Description",
            quantity: "Quantity",
            mrp: "MRP",
            mrp_currency: "Currency of MRP",
            manufactured_by: "Manufactured By",
            marketed_by: "Marketed By",
            mfg_date: "Month & Year of Manufacturing",
            country_of_origin: "Country of Origin",
            customer_care_contact: "Customer Care Contact",
            customer_care_phone: "Customer Care Phone",
            serial_number: "Serial Number",
            product_size: "Product Size",
            unit_sales_price: "Unit Sales Price",
            gst_number: "GST Number",
            expiry_date: "Expiry Date",
            expiry_details: "Expiry Details",
            customer_care_email: "Customer Care Email",
            website: "Website",
            storage_location_manufacturer: "Storage Location (Manufacturer)",
            storage_instructions_consumer: "Storage Instructions (Consumer)",
            package_recycling: "Package Recycling",
            location_coordinates: "Location Coordinates",
            whatsapp_link: "WhatsApp Link",
            notes: "Notes"
        };

        function closeTab() {
            window.close();
            setTimeout(() => {
                window.open('', '_self', '');
                window.close();
            }, 100);
            setTimeout(() => {
                alert("Your browser security settings prevented automatically closing this tab. Please close it manually.");
            }, 500);
        }

        function hideLoader() {
            const loader = document.getElementById("loader");
            if (loader) loader.classList.add("hidden");
        }

        // Renders YouTube, Facebook, Vimeo, MP4, PDF, Images, and Base64 Media
        function renderMediaElement(src, filename = "") {
            if (!src) return "";

            const cleanSrc = src.trim();

            // 1. YouTube Videos
            const ytMatch = cleanSrc.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=|shorts\/))([\w-]{11})/);
            if (ytMatch && ytMatch[1]) {
                return `<iframe src="https://www.youtube.com/embed/${ytMatch[1]}" class="img-preview" style="border:0;" allowfullscreen></iframe>`;
            }

            // 2. Facebook Video Embed (Uses official Facebook Plugin Iframe endpoint)
            if (cleanSrc.includes("facebook.com") || cleanSrc.includes("fb.watch")) {
                const encodedUrl = encodeURIComponent(cleanSrc);
                const fbEmbedSrc = `https://www.facebook.com/plugins/video.php?height=250&href=${encodedUrl}&show_text=false&width=500`;
                return `
                    <iframe src="${fbEmbedSrc}" class="img-preview" style="border:0; width:100%; height:250px; scrolling:no; allow:autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share" allowfullscreen="true"></iframe>
                    <a href="${cleanSrc}" target="_blank" rel="noopener noreferrer" style="font-size:0.8rem; color:#10b981; margin-top:0.3rem; display:inline-block;">↗ Open Video on Facebook</a>
                `;
            }

            // 3. Vimeo Videos
            if (cleanSrc.includes("vimeo.com/")) {
                const videoId = cleanSrc.split("vimeo.com/")[1]?.split("?")[0];
                return `<iframe src="https://player.vimeo.com/video/${videoId}" class="img-preview" style="border:0;" allowfullscreen></iframe>`;
            }

            // 4. Direct Video Files (MP4/WebM/Base64 Video)
            if (cleanSrc.match(/\.(mp4|webm|ogg)$/i) || cleanSrc.startsWith("data:video")) {
                return `<video src="${cleanSrc}" controls class="img-preview"></video>`;
            }

            // 5. PDF Documents
            if (cleanSrc.match(/\.pdf$/i) || cleanSrc.startsWith("data:application/pdf")) {
                return `
                    <object data="${cleanSrc}" type="application/pdf" class="img-preview" style="height:250px;">
                        <iframe src="${cleanSrc}" style="width:100%; height:250px; border:0;"></iframe>
                    </object>
                    <a href="${cleanSrc}" download="${filename || 'document.pdf'}" class="btn-download">📄 Download PDF</a>
                `;
            }

            // 6. Base64 & Direct Images (PNG, JPG, WebP, SVG, etc.)
            if (cleanSrc.match(/\.(jpg|jpeg|png|gif|webp|svg)$/i) || cleanSrc.startsWith("data:image")) {
                return `<img src="${cleanSrc}" alt="Product Media" class="img-preview" />`;
            }

            // 7. Generic File Download Link Fallback
            return `
                <div style="padding: 1rem; text-align: center; background: #09090b; border-radius: 8px; border: 1px dashed #3f3f46;">
                    <a href="${cleanSrc}" download="${filename || 'file'}" class="btn-download">📁 View / Download File</a>
                </div>
            `;
        }

        function renderData(data) {
            const title = data.product_name ? `${data.product_name} - Specifications` : "Product Specifications";
            document.title = title;
            document.getElementById("pageTitle").textContent = title;

            // Render Product Specifications Grid
            const specsGrid = document.getElementById("specsGrid");
            let specsHtml = "";
            let count = 0;

            Object.keys(fieldLabels).forEach((key) => {
                const val = data[key];
                if (val && val.toString().trim() !== "") {
                    count++;
                    const isFullWidth = ["description", "notes", "storage_instructions_consumer", "expiry_details"].includes(key);
                    specsHtml += `
                        <div class="spec-card ${isFullWidth ? 'full-width' : ''}">
                            <div class="spec-label">${fieldLabels[key]}</div>
                            <div class="spec-value">${val}</div>
                        </div>
                    `;
                }
            });

            specsGrid.innerHTML = count > 0 ? specsHtml : `<div class="spec-card full-width" style="color:#71717a;">No specifications found.</div>`;

            // 1. Render Product Images FIRST (Excludes Splash Screen Logo)
            let imageList = [];
            if (data.product_images && Array.isArray(data.product_images)) {
                imageList = data.product_images.filter(i => i.file || i.base64 || i.url || i.description);
            } else {
                for (let i = 1; i <= 6; i++) {
                    const desc = data[`img_desc_${i}`];
                    const file = data[`img_file_${i}`];
                    if (file || desc) {
                        imageList.push({ label: `Product Image ${i}`, file: file, description: desc || "" });
                    }
                }
            }

            if (imageList.length > 0) {
                let imgsHtml = "";
                imageList.forEach(img => {
                    const mediaSrc = img.file?.base64 || img.base64 || img.url || (typeof img.file === 'string' ? img.file : '');
                    const fileName = img.file?.filename || "";
                    const mediaElement = renderMediaElement(mediaSrc, fileName);

                    imgsHtml += `
                        <div class="spec-card">
                            ${mediaElement}
                            ${img.label ? `<div style="font-weight:700; color:#10b981; font-size:0.9rem; margin-top:0.5rem;">${img.label}</div>` : ''}
                            ${img.description ? `<div style="font-size:0.85rem; color:#a1a1aa; margin-top:0.25rem;">${img.description}</div>` : ''}
                        </div>
                    `;
                });
                document.getElementById("imagesGrid").innerHTML = imgsHtml;
                document.getElementById("imagesSection").style.display = "block";
            }

            // 2. Render Product Videos SECOND
            let videoList = [];
            if (data.product_videos && Array.isArray(data.product_videos)) {
                videoList = data.product_videos.filter(v => v.link && v.link.trim() !== "");
            } else {
                for (let i = 1; i <= 3; i++) {
                    const link = data[`video_link_${i}`];
                    const desc = data[`video_desc_${i}`];
                    if (link && link.trim() !== "") {
                        videoList.push({ link: link, description: desc || "" });
                    }
                }
            }

            if (videoList.length > 0) {
                let videosHtml = "";
                videoList.forEach((v, index) => {
                    const mediaElement = renderMediaElement(v.link);
                    videosHtml += `
                        <div class="spec-card">
                            ${mediaElement}
                            <div style="font-weight:700; color:#10b981; font-size:0.9rem; margin-top:0.5rem;">Video ${index + 1}</div>
                            ${v.description ? `<div style="font-size:0.85rem; color:#a1a1aa; margin-top:0.25rem;">${v.description}</div>` : ''}
                        </div>
                    `;
                });
                document.getElementById("videosGrid").innerHTML = videosHtml;
                document.getElementById("videosSection").style.display = "block";
            }

            // 3. Render Certificates THIRD
            let certList = [];
            if (data.certificates && Array.isArray(data.certificates)) {
                certList = data.certificates.filter(c => c.name || c.description || c.file);
            } else {
                for (let i = 1; i <= 10; i++) {
                    const name = data[`cert_name_${i}`];
                    const desc = data[`cert_desc_${i}`];
                    const file = data[`cert_file_${i}`];
                    if (name || desc || file) {
                        certList.push({ name: name || `Certificate ${i}`, description: desc || "", file: file });
                    }
                }
            }

            if (certList.length > 0) {
                let certsHtml = "";
                certList.forEach(c => {
                    const certSrc = c.file?.base64 || c.file?.url || (typeof c.file === 'string' ? c.file : '');
                    const fileName = c.file?.filename || `${c.name || 'certificate'}`;
                    const mediaElement = certSrc ? renderMediaElement(certSrc, fileName) : "";

                    certsHtml += `
                        <div class="spec-card">
                            ${mediaElement}
                            <div style="font-weight:700; color:#10b981; font-size:1rem; margin-top: 0.5rem;">${c.name || 'Certificate'}</div>
                            ${c.description ? `<div style="font-size:0.85rem; color:#a1a1aa; margin-top:0.25rem;">${c.description}</div>` : ''}
                        </div>
                    `;
                });
                document.getElementById("certsGrid").innerHTML = certsHtml;
                document.getElementById("certificatesSection").style.display = "block";
            }

            document.getElementById("contentContainer").classList.add("visible");
            hideLoader();
        }

        async function fetchProductData() {
            const urlParams = new URLSearchParams(window.location.search);
            const linkId = urlParams.get("id");

            if (!linkId) {
                const savedLocal = localStorage.getItem("puretrace_local_data");
                if (savedLocal) {
                    try {
                        renderData(JSON.parse(savedLocal));
                        return;
                    } catch (e) { }
                }
                showError("No Product ID specified in URL.");
                return;
            }

            try {
                const res = await fetch(`${API_BASE}/get_medsign_link/${linkId}`);
                if (res.ok) {
                    const responseData = await res.json();
                    if (responseData?.record?.product_details) {
                        renderData(responseData.record.product_details);
                    } else {
                        showError("No product specifications available for this ID.");
                    }
                } else {
                    showError("Failed to load specifications from database.");
                }
            } catch (err) {
                console.error("Fetch error:", err);
                showError("Network error. Please check your connection.");
            }
        }

        function showError(message) {
            hideLoader();
            const container = document.getElementById("contentContainer");
            container.innerHTML = `<div class="error-message">⚠️ ${message}</div>`;
            container.classList.add("visible");
        }

        fetchProductData();
    </script>
</body>

</html>
