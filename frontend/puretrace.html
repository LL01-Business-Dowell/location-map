<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PureTrace</title>
    <style>
        /* Reset & Base Styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: white;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 1.5rem 1.5rem 3.5rem 1.5rem;
            overflow-x: hidden;
        }

        /* Page Initial Spinner */
        #pageSpinner {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        #pageSpinner.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* Main Content Animations */
        main {
            width: 100%;
            max-width: 440px;
            text-align: center;
            opacity: 0;
            transform: translateY(12px);
            transition: opacity 0.4s ease-out, transform 0.4s ease-out;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        main.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Prominent Title */
        h1 {
            font-size: 3.25rem;
            font-weight: 800;
            letter-spacing: -0.04em;
            color: #ffffff;
            margin-bottom: 2rem;
        }

        /* Splash Screen Media Containers */
        .splash-video-container {
            width: 100%;
            margin-bottom: 1.5rem;
            border-radius: 12px;
            overflow: hidden;
            background: #18181b;
            border: 1px solid #27272a;
            aspect-ratio: 16 / 9;
        }

        .splash-video-container iframe,
        .splash-video-container video {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .splash-logo-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 2rem;
        }

        .splash-logo-container img {
            max-width: 180px;
            max-height: 100px;
            object-fit: contain;
        }

        /* Side-by-Side Action Buttons Container */
        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.25rem;
            width: 100%;
            margin-bottom: 1.5rem;
        }

        /* Prominent Emerald Green Buttons */
        .btn-primary {
            position: relative;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            padding: 1.25rem 1rem;
            font-size: 1.15rem;
            font-weight: 700;
            border-radius: 14px;
            border: none;
            background-color: #10b981;
            color: #000000;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .btn-primary:hover {
            background-color: #059669;
            color: #ffffff;
        }

        .btn-primary:active {
            transform: scale(0.96);
        }

        .btn-primary:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background-color: #27272a;
            color: #ffffff;
            border: 1px solid #3f3f46;
            padding: 0.75rem 1.25rem;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-secondary:hover {
            background-color: #3f3f46;
        }

        .btn-danger {
            background-color: transparent;
            color: #ef4444;
            border: 1px solid #ef4444;
            padding: 0.75rem 1.25rem;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-danger:hover {
            background-color: #ef4444;
            color: #ffffff;
        }

        /* Smaller Close Button */
        .btn-close {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            padding: 0.5rem 1rem;
            font-size: 0.8rem;
            font-weight: 500;
            border-radius: 8px;
            border: 1px solid #27272a;
            background-color: transparent;
            color: #71717a;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 1.5rem;
        }

        .btn-close:hover {
            background-color: #18181b;
            color: #a1a1aa;
            border-color: #3f3f46;
        }

        .btn-close:active {
            transform: scale(0.96);
        }

        /* Social Icons & URL ID Footer */
        .social-links {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1rem;
            margin-top: 1rem;
            margin-bottom: 0.75rem;
        }

        .social-icon {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: #18181b;
            border: 1px solid #27272a;
            color: #a1a1aa;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .social-icon:hover {
            background-color: #27272a;
            color: #10b981;
            border-color: #10b981;
        }

        .social-icon svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .url-id-footer {
            font-size: 0.75rem;
            color: #71717a;
            letter-spacing: 0.05em;
            margin-bottom: 1rem;
        }

        .brand-footer {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            font-size: 0.8rem;
            color: #a1a1aa;
            text-align: center;
            margin-top: 0.5rem;
        }

        .brand-footer a {
            color: #10b981;
            text-decoration: none;
            font-weight: 500;
        }

        .brand-footer a:hover {
            text-decoration: underline;
        }

        /* Modal Overlay Styles */
        .modal-overlay {
            display: flex;
            opacity: 0;
            visibility: hidden;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            padding: 1rem;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-card {
            background-color: #18181b;
            border: 1px solid #27272a;
            border-radius: 16px;
            padding: 2rem;
            width: 100%;
            max-width: 850px;
            max-height: 90vh;
            overflow-y: auto;
            text-align: left;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            transform: scale(0.95);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);

            display: flex;
            flex-direction: column;
        }

        #productDetailsForm {
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .modal-overlay.active .modal-card {
            transform: scale(1);
        }

        .modal-card h2 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            color: #ffffff;
            text-align: center;
        }

        .modal-card p.subtitle {
            font-size: 0.9rem;
            color: #a1a1aa;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .section-title {
            font-size: 1.15rem;
            color: #10b981;
            border-bottom: 1px solid #27272a;
            padding-bottom: 0.5rem;
            margin: 1.5rem 0 1rem 0;
            font-weight: 700;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        .form-group label {
            font-size: 0.825rem;
            color: #d4d4d8;
            font-weight: 600;
        }

        .form-group label span.req {
            color: #ef4444;
            margin-left: 2px;
        }

        .form-group input[type="text"],
        .form-group input[type="number"],
        .form-group input[type="date"],
        .form-group input[type="email"],
        .form-group input[type="url"],
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 0.7rem;
            font-size: 0.9rem;
            background-color: #09090b;
            border: 1px solid #3f3f46;
            border-radius: 8px;
            color: #ffffff;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 70px;
        }

        .form-group input[type="file"] {
            font-size: 0.8rem;
            color: #a1a1aa;
            background: #09090b;
            padding: 0.5rem;
            border: 1px dashed #3f3f46;
            border-radius: 8px;
            cursor: pointer;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: #10b981;
        }

        .nested-card {
            background-color: #09090b;
            border: 1px solid #27272a;
            border-radius: 10px;
            padding: 1rem;
            margin-bottom: 0.75rem;
        }

        .nested-card-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: #10b981;
            margin-bottom: 0.75rem;
        }

        /* Modal Form Action Buttons Grid */
        .modal-actions-grid {
            margin-top: 2rem;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.75rem;
        }

        /* CSS Spinner Component */
        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            border-top-color: #10b981;
            animation: spin 0.8s linear infinite;
        }

        .spinner-btn {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(0, 0, 0, 0.25);
            border-radius: 50%;
            border-top-color: #000000;
            animation: spin 0.8s linear infinite;
            display: inline-block;
            margin-right: 6px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 640px) {
            .modal-actions-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 2.75rem;
            }

            .action-buttons {
                grid-template-columns: 1fr;
                gap: 1rem;
            }

            .modal-overlay {
                padding: 0.5rem;
            }

            .modal-card {
                padding: 1.25rem 1rem 2rem 1rem;
                max-height: 95vh;
            }

            .brand-footer {
                margin-top: 2rem;
                padding-bottom: 1.5rem;
            }
        }
    </style>
</head>

<body>

    <!-- Fullscreen Initial Loader -->
    <div id="pageSpinner">
        <div class="spinner"></div>
    </div>

    <!-- Main Page Content -->
    <main id="mainContent">
        <!-- Top Splash Video Container (Rendered Dynamically) -->
        <div id="splashVideoContainer" class="splash-video-container" style="display: none;"></div>

        <!-- Top Splash Logo Container (Rendered Dynamically) -->
        <div id="splashLogoContainer" class="splash-logo-container" style="display: none;"></div>

        <!-- Action Buttons Container -->
        <div class="action-buttons">
            <button type="button" class="btn-primary" id="specificationsBtn" onclick="openSpecificationsPage()">
                Specifications
            </button>
            <a id="feedbackBtn" href="#" target="_blank" class="btn-primary">
                Feedback
            </a>
        </div>

        <button type="button" class="btn-close" onclick="openThankYouAndClose()">
            Close
        </button>

        <!-- Social Media Links (Rendered Dynamically) -->
        <div id="socialLinksContainer" class="social-links" style="display: none;"></div>

        <!-- ID Footer Text -->
        <div id="urlIdDisplay" class="url-id-footer"></div>

    </main>

    <!-- Complete Product Form Modal -->
    <div id="batchModal" class="modal-overlay">
        <div class="modal-card">
            <h2>Product Registration Details</h2>
            <p class="subtitle">Fields marked with (<span style="color:#ef4444">*</span>) are mandatory.</p>
            <div id="modalLinkIdDisplay"
                style="text-align: center; font-size: 0.8rem; color: #10b981; margin-top: -1rem; margin-bottom: 1.25rem; font-weight: 600;">
            </div>

            <form id="productDetailsForm">

                <!-- SECTION 1: Product Specifications -->
                <div class="section-title">1. Product Specifications</div>
                <div class="form-grid">
                    <!-- Mandatory Fields -->
                    <div class="form-group">
                        <label for="product_name">Product Name <span class="req">*</span></label>
                        <input type="text" id="product_name" name="product_name" required />
                    </div>
                    <div class="form-group">
                        <label for="batch_id">Batch Number <span class="req">*</span></label>
                        <input type="text" id="batch_id" name="batch_id" required placeholder="e.g. BATCH12345" />
                    </div>
                    <div class="form-group full-width">
                        <label for="description">Description <span class="req">*</span></label>
                        <textarea id="description" name="description" required></textarea>
                    </div>
                    <div class="form-group">
                        <label for="quantity">Quantity <span class="req">*</span></label>
                        <input type="number" id="quantity" name="quantity" required />
                    </div>
                    <div class="form-group">
                        <label for="mrp">MRP (inclusive of all taxes) <span class="req">*</span></label>
                        <input type="number" step="0.01" id="mrp" name="mrp" required />
                    </div>
                    <div class="form-group">
                        <label for="mrp_currency">Currency of MRP <span class="req">*</span></label>
                        <input type="text" id="mrp_currency" name="mrp_currency" placeholder="INR, USD, etc."
                            required />
                    </div>
                    <div class="form-group">
                        <label for="manufactured_by">Manufactured By <span class="req">*</span></label>
                        <input type="text" id="manufactured_by" name="manufactured_by" required />
                    </div>
                    <div class="form-group">
                        <label for="marketed_by">Marketed By <span class="req">*</span></label>
                        <input type="text" id="marketed_by" name="marketed_by" required />
                    </div>
                    <div class="form-group">
                        <label for="mfg_date">Month and Year of Manufacturing <span class="req">*</span></label>
                        <input type="text" id="mfg_date" name="mfg_date" placeholder="e.g. 10/2026" required />
                    </div>
                    <div class="form-group">
                        <label for="country_of_origin">Country of Origin <span class="req">*</span></label>
                        <input type="text" id="country_of_origin" name="country_of_origin" required />
                    </div>
                    <div class="form-group">
                        <label for="customer_care_contact">Customer Care Contact <span class="req">*</span></label>
                        <input type="text" id="customer_care_contact" name="customer_care_contact" required />
                    </div>
                    <div class="form-group">
                        <label for="customer_care_phone">Customer Care Phone Number <span class="req">*</span></label>
                        <input type="text" id="customer_care_phone" name="customer_care_phone" required />
                    </div>

                    <!-- Splash Screen Customization (Optional) -->
                    <div class="form-group">
                        <label for="splash_screen_logo">Splash Screen Logo</label>
                        <input type="file" id="splash_screen_logo" name="splash_screen_logo" accept="image/*" />
                    </div>
                    <div class="form-group">
                        <label for="splash_screen_video">Splash Screen Video (YouTube, Facebook, or Direct URL)</label>
                        <input type="url" id="splash_screen_video" name="splash_screen_video"
                            placeholder="https://www.youtube.com/watch?v=..." />
                    </div>

                    <!-- Optional Fields -->
                    <div class="form-group">
                        <label for="serial_number">Serial Number</label>
                        <input type="text" id="serial_number" name="serial_number" />
                    </div>
                    <div class="form-group">
                        <label for="product_size">Product Size</label>
                        <input type="text" id="product_size" name="product_size" />
                    </div>
                    <div class="form-group">
                        <label for="unit_sales_price">Unit Sales Price</label>
                        <input type="number" step="0.01" id="unit_sales_price" name="unit_sales_price" />
                    </div>
                    <div class="form-group">
                        <label for="gst_number">GST Number</label>
                        <input type="text" id="gst_number" name="gst_number" />
                    </div>
                    <div class="form-group">
                        <label for="expiry_date">Expiry Date</label>
                        <input type="date" id="expiry_date" name="expiry_date" />
                    </div>
                    <div class="form-group full-width">
                        <label for="expiry_details">Expiry Details</label>
                        <input type="text" id="expiry_details" name="expiry_details" />
                    </div>
                    <div class="form-group">
                        <label for="customer_care_email">Customer Care Email ID</label>
                        <input type="email" id="customer_care_email" name="customer_care_email" />
                    </div>
                    <div class="form-group">
                        <label for="website">Website</label>
                        <input type="url" id="website" name="website" placeholder="https://..." />
                    </div>
                    <div class="form-group">
                        <label for="storage_location_manufacturer">Storage Location by Manufacturer</label>
                        <input type="text" id="storage_location_manufacturer" name="storage_location_manufacturer" />
                    </div>
                    <div class="form-group full-width">
                        <label for="storage_instructions_consumer">Storage Instructions for Consumer</label>
                        <textarea id="storage_instructions_consumer" name="storage_instructions_consumer"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="package_recycling">Package Recycling</label>
                        <input type="text" id="package_recycling" name="package_recycling" />
                    </div>
                    <div class="form-group">
                        <label for="location_coordinates">Location Coordinates</label>
                        <input type="text" id="location_coordinates" name="location_coordinates"
                            placeholder="Lat, Lng" />
                    </div>
                    <div class="form-group">
                        <label for="whatsapp_link">WhatsApp Link</label>
                        <input type="url" id="whatsapp_link" name="whatsapp_link" placeholder="https://wa.me/..." />
                    </div>
                    <div class="form-group full-width">
                        <label for="notes">Notes</label>
                        <textarea id="notes" name="notes"></textarea>
                    </div>
                </div>

                <!-- SECTION 2: Product Videos (Optional) -->
                <div class="section-title">Product Videos (Optional)</div>
                <div class="nested-card">
                    <div class="nested-card-title">Video 1</div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="video_link_1">Video Link</label>
                            <input type="url" id="video_link_1" name="video_link_1" placeholder="https://..." />
                        </div>
                        <div class="form-group">
                            <label for="video_desc_1">Description</label>
                            <input type="text" id="video_desc_1" name="video_desc_1"
                                placeholder="Video 1 Description" />
                        </div>
                    </div>
                </div>
                <div class="nested-card">
                    <div class="nested-card-title">Video 2</div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="video_link_2">Video Link</label>
                            <input type="url" id="video_link_2" name="video_link_2" placeholder="https://..." />
                        </div>
                        <div class="form-group">
                            <label for="video_desc_2">Description</label>
                            <input type="text" id="video_desc_2" name="video_desc_2"
                                placeholder="Video 2 Description" />
                        </div>
                    </div>
                </div>
                <div class="nested-card">
                    <div class="nested-card-title">Video 3</div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="video_link_3">Video Link</label>
                            <input type="url" id="video_link_3" name="video_link_3" placeholder="https://..." />
                        </div>
                        <div class="form-group">
                            <label for="video_desc_3">Description</label>
                            <input type="text" id="video_desc_3" name="video_desc_3"
                                placeholder="Video 3 Description" />
                        </div>
                    </div>
                </div>

                <!-- SECTION 3: Social Media Links (Optional) -->
                <div class="section-title">3. Social Links (Optional)</div>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="social_youtube">YouTube</label>
                        <input type="url" id="social_youtube" name="social_youtube"
                            placeholder="https://youtube.com/..." />
                    </div>
                    <div class="form-group">
                        <label for="social_instagram">Instagram</label>
                        <input type="url" id="social_instagram" name="social_instagram"
                            placeholder="https://instagram.com/..." />
                    </div>
                    <div class="form-group">
                        <label for="social_facebook">Facebook</label>
                        <input type="url" id="social_facebook" name="social_facebook"
                            placeholder="https://facebook.com/..." />
                    </div>
                </div>

                <!-- SECTION 4: Certificates (1 - 10) -->
                <div class="section-title">4. Certificates (Optional)</div>
                <div id="certificatesContainer"></div>

                <!-- SECTION 5: Product Images (1 - 6) -->
                <div class="section-title">5. Product Images (Optional)</div>
                <div id="productImagesContainer"></div>

                <!-- Action Buttons: Exit, Preview, Save, Submit -->
                <div class="modal-actions-grid">
                    <button type="button" class="btn-danger" id="exitBtn" onclick="closeModal()">Exit</button>
                    <button type="button" class="btn-secondary" id="previewBtn"
                        onclick="openSpecificationsPage()">Preview Page</button>
                    <button type="button" class="btn-secondary" id="saveBtn" onclick="saveLocally()">Save</button>
                    <button type="submit" class="btn-primary" id="submitBatchBtn">
                        <span id="btnText">Submit</span>
                    </button>
                </div>
                <div class="brand-footer" style="margin-top: 1.5rem;">
                    <div>PureTrace @ DoWell Research</div>
                    <div><a href="https://www.dowellresearch.com" target="_blank">www.dowellresearch.com</a></div>
                </div>
            </form>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="state.js"></script>
    <script src="utils.js"></script>
    <script src="api.js"></script>

    <script>
        const API_BASE = "https://location-map-a89a.onrender.com/api";
        
        // Tab-session Memory Cache for long-running tab instances
        let storedProductData = null;
        const memoryCache = {
            images: {},
            videos: {}
        };

        const fieldLabels = {
            product_name: "Product Name",
            batch_id: "Batch Number",
            description: "Description",
            quantity: "Quantity",
            mrp: "MRP",
            mrp_currency: "Currency of MRP",
            manufactured_by: "Manufactured By",
            marketed_by: "Marketed By",
            mfg_date: "Month & Year of Manufacturing",
            country_of_origin: "Country of Origin",
            customer_care_contact: "Customer Care Contact",
            customer_care_phone: "Customer Care Phone",
            splash_screen_video: "Splash Screen Video URL",
            social_youtube: "YouTube Link",
            social_instagram: "Instagram Link",
            social_facebook: "Facebook Link",
            serial_number: "Serial Number",
            product_size: "Product Size",
            unit_sales_price: "Unit Sales Price",

        function hidePageSpinner() {
            const pageSpinner = document.getElementById("pageSpinner");
            if (pageSpinner) pageSpinner.classList.add("hidden");
        }

        async function showMainContent() {
            // Wait for media preload to complete before making page visible
            await renderSplashAndSocials();
            hidePageSpinner();
            document.getElementById("mainContent").classList.add("visible");
        }

        function showModal() {
            hidePageSpinner();
            document.getElementById("batchModal").classList.add("active");
        }

        function closeModal() {
            document.getElementById("batchModal").classList.remove("active");
            showMainContent();
        }

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                if (!file || !(file instanceof File) || file.size === 0) {
                    return resolve(null);
                }
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = (err) => reject(err);
                reader.readAsDataURL(file);
            });
        }

        function openThankYouAndClose() {
            window.open('thank_you.html', '_blank');
            window.close();
        }

        function formatEmbedVideoUrl(url) {
            if (!url) return null;
            let videoUrl = url.trim();

            const ytMatch = videoUrl.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/);
            if (ytMatch && ytMatch[1]) {
                return { type: 'iframe', src: `https://www.youtube.com/embed/${ytMatch[1]}` };
            }

            if (videoUrl.includes("facebook.com")) {
                const encoded = encodeURIComponent(videoUrl);
                return { type: 'iframe', src: `https://www.facebook.com/plugins/video.php?href=${encoded}&show_text=false` };
            }

            return { type: 'video', src: videoUrl };
        }

        function preloadImage(url) {
            return new Promise((resolve) => {
                if (!url) return resolve(false);
                if (memoryCache.images[url]) return resolve(true);

                const img = new Image();
                img.onload = () => {
                    memoryCache.images[url] = img;
                    resolve(true);
                };
                img.onerror = () => resolve(false);
                img.src = url;
            });
        }

        function preloadVideo(url) {
            return new Promise((resolve) => {
                if (!url) return resolve(false);
                const formatted = formatEmbedVideoUrl(url);
                if (!formatted) return resolve(false);

                if (formatted.type === 'iframe') {
                    // Embeds load asynchronously via iframe load event
                    resolve(true);
                } else {
                    if (memoryCache.videos[url]) return resolve(true);
                    const vid = document.createElement('video');
                    vid.onloadeddata = () => {
                        memoryCache.videos[url] = vid;
                        resolve(true);
                    };
                    vid.onerror = () => resolve(false);
                    vid.src = formatted.src;
                }
            });
        }

        async function renderSplashAndSocials() {
            if (!storedProductData) return;

            const preloads = [];

            // 1. RENDER SPLASH VIDEO
            const splashVideoContainer = document.getElementById("splashVideoContainer");
            const videoUrl = storedProductData.splash_screen_video;

            if (splashVideoContainer && videoUrl && videoUrl.trim() !== "") {
                const formatted = formatEmbedVideoUrl(videoUrl);
                if (formatted) {
                    if (formatted.type === 'iframe') {
                        splashVideoContainer.innerHTML = `<iframe src="${formatted.src}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;
                    } else {
                        splashVideoContainer.innerHTML = `<video src="${formatted.src}" controls autoplay muted playsinline></video>`;
                    }
                    splashVideoContainer.style.display = "block";
                    preloads.push(preloadVideo(videoUrl));
                }
            } else if (splashVideoContainer) {
                splashVideoContainer.style.display = "none";
            }

            // 2. RENDER SPLASH LOGO (PROXIED THROUGH API_BASE)
            const splashLogoContainer = document.getElementById("splashLogoContainer");
            const logoData = storedProductData.splash_screen_logo;

            if (splashLogoContainer && logoData) {
                let imageUrl = null;

                if (typeof logoData === "object" && logoData.file_id) {
                    imageUrl = `${API_BASE}/files/stream/${logoData.file_id}`;
                } else if (typeof logoData === "object" && logoData.file && logoData.file.file_id) {
                    imageUrl = `${API_BASE}/files/stream/${logoData.file.file_id}`;
                } else if (typeof logoData === "string" && logoData.trim() !== "") {
                    imageUrl = logoData.trim();
                }

                if (imageUrl) {
                    splashLogoContainer.innerHTML = `<img src="${imageUrl}" alt="Splash Logo" id="splashLogoImg" />`;
                    splashLogoContainer.style.display = "flex";

                    preloads.push(preloadImage(imageUrl));

                    const imgElem = document.getElementById("splashLogoImg");
                    if (imgElem) {
                        imgElem.onerror = function () {
                            console.error("Failed to load splash screen logo image from URL:", imageUrl);
                            splashLogoContainer.style.display = "none";
                        };
                    }
                } else {
                    splashLogoContainer.style.display = "none";
                }
            } else if (splashLogoContainer) {
                splashLogoContainer.style.display = "none";
            }

            // Wait for all preloads to resolve before completing setup
            await Promise.all(preloads);
        }

        async function collectFormData() {
            const form = document.getElementById("productDetailsForm");
            const formData = new FormData(form);
            const payloadData = {};

            for (let [key, val] of formData.entries()) {
                if (!(val instanceof File)) {
                    payloadData[key] = val.trim();
                }
            }

            // 1. Splash Screen Logo (GridFS upload)
            const logoInput = document.getElementById("splash_screen_logo");
            const logoFile = logoInput ? logoInput.files[0] : null;
            if (logoFile && logoFile.size > 0) {
                payloadData.splash_screen_logo = await uploadImageToGridFS(logoFile);
            } else if (storedProductData && storedProductData.splash_screen_logo) {
                payloadData.splash_screen_logo = storedProductData.splash_screen_logo;
            }

            // 2. Product Videos (Direct Links preserved)
            payloadData.product_videos = [];
            for (let i = 1; i <= 3; i++) {
                const link = formData.get(`video_link_${i}`);
                const desc = formData.get(`video_desc_${i}`);

                if (link || desc) {
                    payloadData.product_videos.push({
                        id: i,
                        link: link || "",
                        description: desc || ""
                    });
                }
            }

            // 3. Certificates (GridFS upload for documents/images)
            payloadData.certificates = [];
            for (let i = 1; i <= 10; i++) {
                const name = formData.get(`cert_name_${i}`);
                const fileInput = document.getElementById(`cert_file_${i}`);
                const file = fileInput ? fileInput.files[0] : null;
                const desc = formData.get(`cert_desc_${i}`);

                let fileData = null;
                if (file && file.size > 0) {
                    fileData = await uploadImageToGridFS(file);
                } else if (storedProductData && storedProductData.certificates?.[i - 1]?.file) {
                    fileData = storedProductData.certificates[i - 1].file;
                }

                if (name || desc || fileData) {
                    payloadData.certificates.push({
                        id: i,
                        name: name || "",
                        file: fileData,
                        description: desc || ""
                    });
                }
            }

            // 4. Product Images (GridFS upload)
            payloadData.product_images = [];
            for (let i = 1; i <= 6; i++) {
                const fileInput = document.getElementById(`img_file_${i}`);
                const file = fileInput ? fileInput.files[0] : null;
                const desc = formData.get(`img_desc_${i}`);
                const label = imageLabels[i - 1];

                let fileData = null;
                if (file && file.size > 0) {
                    fileData = await uploadImageToGridFS(file);
                } else if (storedProductData && storedProductData.product_images?.[i - 1]?.file) {
                    fileData = storedProductData.product_images[i - 1].file;
                }

                if (desc || fileData) {
                    payloadData.product_images.push({
                        id: i,
                        label: label,
                        file: fileData,
                        description: desc || ""
                    });
                }
            }

            return payloadData;
        }

        async function saveLocally() {
            try {
                const data = await collectFormData();
                const jsonStr = JSON.stringify(data);
                localStorage.setItem("puretrace_local_data", jsonStr);
                sessionStorage.setItem("puretrace_session_data", jsonStr);
                storedProductData = data;
                await renderSplashAndSocials();
                console.log("Product information saved locally on browser!");
            } catch (err) {
                console.error("Save error:", err);
                console.log("Failed to save data locally.");
            }
        }

        function restoreLocalData(data) {
            if (!data) return;
            const form = document.getElementById("productDetailsForm");
            Object.keys(data).forEach((key) => {
                if (form.elements[key] && typeof data[key] === "string") {
                    form.elements[key].value = data[key];
                }
            });

            if (data.product_videos && Array.isArray(data.product_videos)) {
                data.product_videos.forEach((vid) => {
                    if (form.elements[`video_link_${vid.id}`]) form.elements[`video_link_${vid.id}`].value = vid.link || "";
                    if (form.elements[`video_desc_${vid.id}`]) form.elements[`video_desc_${vid.id}`].value = vid.description || "";
                });
            }

            if (data.certificates && Array.isArray(data.certificates)) {
                data.certificates.forEach((cert) => {
                    if (form.elements[`cert_name_${cert.id}`]) form.elements[`cert_name_${cert.id}`].value = cert.name || "";
                    if (form.elements[`cert_desc_${cert.id}`]) form.elements[`cert_desc_${cert.id}`].value = cert.description || "";
                });
            }

            if (data.product_images && Array.isArray(data.product_images)) {
                data.product_images.forEach((img) => {
                    if (form.elements[`img_desc_${img.id}`]) form.elements[`img_desc_${img.id}`].value = img.description || "";
                });
            }
        }

        function openSpecificationsPage() {
            const urlParams = new URLSearchParams(window.location.search);
            const linkId = urlParams.get("id") || "";

            if (linkId) {
                window.open(`specifications.html?id=${encodeURIComponent(linkId)}`, "_blank");
            } else {
                if (storedProductData) {
                    const jsonStr = JSON.stringify(storedProductData);
                    localStorage.setItem("puretrace_local_data", jsonStr);
                    sessionStorage.setItem("puretrace_session_data", jsonStr);
                    window.open("specifications.html", "_blank");
                } else {
                    console.log("No product specifications are available to display.");
                }
            }
        }

        async function captureLocationOnLoad() {
            if (!navigator.geolocation) {
                console.log("no location permission");
                return;
            }

            const urlParams = new URLSearchParams(window.location.search);
            const qrId = urlParams.get("id") || "";

            if (!qrId) {
                console.log("No QR ID found in URL. Scan record skipped.");
                return;
            }

            navigator.geolocation.getCurrentPosition(
                async (pos) => {
                    const lat = Number(pos.coords.latitude.toFixed(5));
                    const lng = Number(pos.coords.longitude.toFixed(5));
                    const timestamp = new Date().toISOString();

                    try {
                        if (typeof recordQrScan === "function") {
                            await recordQrScan({
                                document: {
                                    qr_id: qrId,
                                    latitude: lat,
                                    longitude: lng,
                                    scanned_at: timestamp,
                                    type: "puretrace"
                                }
                            });
                        }
                    } catch (err) {
                        console.error("Scan record failed:", err);
                    }
                },
                (err) => {
                    console.error("Geolocation denied or failed:", err);
                },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        }

        function updateFeedbackLink(linkId, batchId) {
            const feedbackBtn = document.getElementById("feedbackBtn");
            let url = `https://reviewanalysis.uxlivinglab.org/product-feedback?id=${encodeURIComponent(linkId)}`;

            if (batchId) {
                url += `&batch_id=${encodeURIComponent(batchId)}`;
            }

            feedbackBtn.href = url;
        }

        // Page Load Logic
        (async function initBatchCheck() {
            captureLocationOnLoad();
            const urlParams = new URLSearchParams(window.location.search);
            const linkId = urlParams.get("id") || "";

            if (linkId) {
                document.getElementById("urlIdDisplay").textContent = `ID: ${linkId}`;
                const modalLinkIdElem = document.getElementById("modalLinkIdDisplay");
                if (modalLinkIdElem) {
                    modalLinkIdElem.textContent = `ID: ${linkId}`;
                }
            }

            updateFeedbackLink(linkId, "");

            if (!linkId) {
                await showMainContent();
                return;
            }

            const fetchWithTimeout = (url, options, timeout = 7000) => {
                return Promise.race([
                    fetch(url, options),
                    new Promise((_, reject) => setTimeout(() => reject(new Error('Network timeout')), timeout))
                ]);
            };

            let isDataFetchedFromDB = false;

            try {
                const res = await fetchWithTimeout(`${API_BASE}/get_medsign_link/${linkId}`);
                if (res.ok) {
                    const data = await res.json();
                    const record = data?.record;

                    if (record && record.product_details) {
                        storedProductData = record.product_details;
                        sessionStorage.setItem("puretrace_session_data", JSON.stringify(storedProductData));
                        restoreLocalData(storedProductData);
                        await renderSplashAndSocials();
                        isDataFetchedFromDB = true;
                    }

                    const fetchedBatchId = record?.batch_id || record?.product_details?.batch_id || "";
                    updateFeedbackLink(linkId, fetchedBatchId);

                    if (!record || !record.batch_id || record.batch_id.trim() === "") {
                        showModal();
                    } else {
                        await showMainContent();
                    }
                } else {
                    await showMainContent();
                }
            } catch (err) {
                console.warn("API check bypassed or timed out:", err);
                await showMainContent();
            } finally {
                hidePageSpinner();
            }

            if (!isDataFetchedFromDB) {
                const savedSession = sessionStorage.getItem("puretrace_session_data");
                const savedLocal = localStorage.getItem("puretrace_local_data");
                const dataToRestore = savedSession || savedLocal;

                if (dataToRestore) {
                    try {
                        storedProductData = JSON.parse(dataToRestore);
                        restoreLocalData(storedProductData);
                        await renderSplashAndSocials();
                    } catch (e) { }
                }
            }

            // Form Submit Action
            const form = document.getElementById("productDetailsForm");
            const submitBtn = document.getElementById("submitBatchBtn");
            const btnText = document.getElementById("btnText");

            form.addEventListener("submit", async (e) => {
                // Prevent browser standard submission & page refresh
                e.preventDefault();

                console.log("Starting batch form submission process...");
                submitBtn.disabled = true;
                btnText.innerHTML = `<span class="spinner-btn"></span> Submitting...`;

                try {
                    const payloadData = await collectFormData();
                    console.log("Compiled Payload:", payloadData);

                    const currentLinkId = new URLSearchParams(window.location.search).get("id") || linkId || "";

                    console.log(`Sending POST request to ${API_BASE}/update_batch_id...`);
                    const updateRes = await fetch(`${API_BASE}/update_batch_id`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            link_id: currentLinkId,
                            batch_id: payloadData.batch_id,
                            product_details: payloadData
                        })
                    });

                    console.log("Response status code:", updateRes.status);

                    if (!updateRes.ok) {
                        const errorText = await updateRes.text();
                        console.error(`Server returned error status ${updateRes.status}:`, errorText);
                        console.log(`Submission failed (${updateRes.status}): ${errorText}`);
                        return;
                    }

                    const contentType = updateRes.headers.get("content-type");
                    if (!contentType || !contentType.includes("application/json")) {
                        const htmlResponse = await updateRes.text();
                        console.error("Expected JSON response but received non-JSON:", htmlResponse);
                        console.log("Server configuration error: Received standard HTML instead of JSON.");
                        return;
                    }

                    const result = await updateRes.json();
                    console.log("Submission successful:", result);

                    storedProductData = payloadData;
                    sessionStorage.setItem("puretrace_session_data", JSON.stringify(payloadData));
                    localStorage.removeItem("puretrace_local_data");
                    closeModal();
                    console.log("Product registration submitted successfully!");

                } catch (err) {
                    console.error("Error submitting details:", err);
                    console.log(`Frontend or Connection Error: ${err.message}`);
                } finally {
                    submitBtn.disabled = false;
                    btnText.textContent = "Submit";
                }
            });
        })();
    </script>
