<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PureTrace</title>
  <style>
    /* Reset & Base Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #000000;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
    }

    /* Main Content Wrapper */
    main {
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    /* Prominent Title */
    h1 {
      font-size: 3.25rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      color: #ffffff;
      margin-bottom: 3rem;
    }

    /* Side-by-Side Action Buttons Container */
    .action-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
      margin-bottom: 1.5rem;
    }

    /* Prominent Emerald Green Buttons */
    .btn-primary {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      padding: 1.25rem 1rem;
      font-size: 1.15rem;
      font-weight: 700;
      border-radius: 14px;
      border: none;
      background-color: #10b981;
      color: #000000;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .btn-primary:hover {
      background-color: #059669;
      color: #ffffff;
    }

    .btn-primary:active {
      transform: scale(0.96);
    }

    /* Smaller, Subtle Close Button */
    .btn-close {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      padding: 0.5rem 1rem;
      font-size: 0.8rem;
      font-weight: 500;
      border-radius: 8px;
      border: 1px solid #27272a;
      background-color: transparent;
      color: #71717a;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-close:hover {
      background-color: #18181b;
      color: #a1a1aa;
      border-color: #3f3f46;
    }

    .btn-close:active {
      transform: scale(0.96);
    }

    /* Modal Overlay Styles */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(4px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .modal-card {
      background-color: #18181b;
      border: 1px solid #27272a;
      border-radius: 16px;
      padding: 2rem;
      width: 90%;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .modal-card h2 {
      font-size: 1.5rem;
      margin-bottom: 0.75rem;
      color: #ffffff;
    }

    .modal-card p {
      font-size: 0.9rem;
      color: #a1a1aa;
      margin-bottom: 1.25rem;
    }

    .modal-card input {
      width: 100%;
      padding: 0.8rem;
      font-size: 1rem;
      background-color: #09090b;
      border: 1px solid #3f3f46;
      border-radius: 8px;
      color: #ffffff;
      outline: none;
      margin-bottom: 1.25rem;
      text-align: center;
    }

    .modal-card input:focus {
      border-color: #10b981;
    }

    .modal-card button {
      width: 100%;
    }

    /* Mobile Responsive Stacking */
    @media (max-width: 360px) {
      h1 {
        font-size: 2.75rem;
      }

      .action-buttons {
        grid-template-columns: 1fr;
        gap: 1rem;
      }
    }
  </style>
</head>
<body>

  <main>
    <h1>PureTrace</h1>

    <div class="action-buttons">
      <button type="button" class="btn-primary" onclick="alert('Specifications clicked')">
        Specifications
      </button>
      <button type="button" class="btn-primary" onclick="alert('Feedback clicked')">
        Feedback
      </button>
    </div>

    <button type="button" class="btn-close" onclick="window.close()">
      Close
    </button>
  </main>

  <!-- Batch ID Prompt Modal -->
  <div id="batchModal" class="modal-overlay">
    <div class="modal-card">
      <h2>Enter Batch ID</h2>
      <p>Please enter the Batch ID associated with this document link to continue.</p>
      <input type="text" id="batchIdInput" placeholder="e.g. BATCH12345" />
      <button type="button" class="btn-primary" id="submitBatchBtn">Submit</button>
    </div>
  </div>

  <script>
    const API_BASE = "https://location-map-a89a.onrender.com/api";

    document.addEventListener("DOMContentLoaded", async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const linkId = urlParams.get("id");

      if (!linkId) return;

      try {
        // 1. Fetch link details by ID
        const res = await fetch(`${API_BASE}/get_medsign_link/${linkId}`);
        if (!res.ok) return;

        const data = await res.json();
        const record = data?.record;

        // 2. Check if batch_id is empty or missing
        if (record && (!record.batch_id || record.batch_id.trim() === "")) {
          const modal = document.getElementById("batchModal");
          modal.style.display = "flex";

          document.getElementById("submitBatchBtn").addEventListener("click", async () => {
            const inputVal = document.getElementById("batchIdInput").value.trim();
            if (!inputVal) {
              alert("Please enter a valid Batch ID.");
              return;
            }

            // 3. Update batch_id via backend API
            const updateRes = await fetch(`${API_BASE}/update_batch_id`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ link_id: linkId, batch_id: inputVal })
            });

            if (updateRes.ok) {
              modal.style.display = "none";
              window.location.reload();
            } else {
              alert("Failed to update Batch ID. Please try again.");
            }
          });
        }
      } catch (err) {
        console.error("Error checking batch_id:", err);
      }
    });
  </script>

</body>
</html>
